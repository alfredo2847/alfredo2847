<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Motion Director — escena</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* Paleta: fondo + tinta + acento + apoyo. Cámbiala en el storyboard. */
  :root { --dark:#0e0d0c; --light:#f2ede4; --ink:#141312; --accent:#ff3b30; --support:#2f7bff; }
  #stage { font-family: 'Inter', sans-serif; }
  #world, .scene, .cam { position: absolute; inset: 0; }
  .scene.dark { background: var(--dark); color: #fff; }
  .scene.light { background: var(--light); color: var(--ink); }
  .scene.color { background: var(--accent); color: var(--ink); }
  .h { font-family: 'Barlow Condensed', sans-serif; font-weight: 800; text-transform: uppercase; line-height: .86; }
  .k { font: 700 46px/1 'JetBrains Mono', monospace; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
  .line { position: absolute; left: 90px; right: 90px; top: 560px; font-size: 150px; }
  .line .key { color: var(--accent); }
  .scene.color .line .key { color: #fff; }
  .num { position: absolute; left: 90px; top: 380px; }
</style>
</head>
<body>
<div id="stage"><div id="world"></div></div>

<script src="voice.js"></script>
<script src="motion.js"></script>
<script>
/*
 * PLANTILLA AUTOMÁTICA: genera un plano por cada línea de guion.txt.
 * Sirve para ver el ritmo con la voz desde el minuto uno. Después, sustitúyela por
 * planos dirigidos a mano (ver examples/vitalpet/scene.html de la skill) siguiendo el storyboard.
 */
M.setup({ music: 'bed:pulse', bpm: 104, musicDb: -18, tail: 1.3 });

const lines = M.lines();
const looks = ['dark', 'light', 'dark', 'color'];
const entries = ['rise', 'slam', 'pop', 'blur', 'mask'];
const transitions = [null, 'whip', 'flash', 'pixels', 'zoom', 'bars', 'iris'];
const cut = (i) => (i === 0 ? 0 : lines[i].start - 0.05);
const world = document.getElementById('world');

lines.forEach((l, i) => {
  const a = cut(i), b = i + 1 < lines.length ? cut(i + 1) : M.duration;
  // palabra clave = la más larga de la línea (cámbialo por la que elijas en el storyboard)
  const words = l.text.split(/\s+/);
  const key = words.reduce((x, y) => (M.norm(y).length > M.norm(x).length ? y : x));
  const sec = document.createElement('section');
  sec.className = 'scene ' + looks[i % looks.length];
  sec.id = 's' + i;
  sec.innerHTML = `<div class="cam" id="c${i}">
      <div class="k num">${String(i + 1).padStart(2, '0')} / ${String(lines.length).padStart(2, '0')}</div>
      <div class="h line" id="t${i}">${words.map((w) => (w === key ? `<span class="key">${w}</span>` : w)).join(' ')}</div>
    </div>`;
  world.appendChild(sec);

  M.scene('#s' + i, a, b);
  M.reveal(`#t${i}`, { at: Math.max(a, l.start - 0.05), sync: true, style: entries[i % entries.length], dur: 0.4 });
  M.reveal(`#c${i} .num`, { at: a, style: 'type' });
  const tk = M.at(key, 1, l.start - 0.01);
  M.camera('#c' + i, { keys: [[a, { s: 1 }], [b, { s: 1.06 }, 'linear']], punch: [tk], drift: 4 });
  M.cue(tk, i === lines.length - 1 ? 'hit' : 'bass', -4);
  const tr = transitions[i % transitions.length];
  if (i > 0 && tr) M.transition(a, tr, { color: '#141312' });
});

M.grain(0.035);
</script>
</body>
</html>
